[package]
name = "soko-desktop"
version = "0.1.0"
description = "Soko Desktop Companion - Dynamic Island HUD & Background Daemon"
authors = ["Soko Project"]
edition = "2021"

[lib]
name = "soko_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Tauri v2 Desktop Framework
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"

# Async Runtime & Concurrency
tokio = { version = "1.38", features = ["full"] }
futures-util = "0.3"

# Serialization & Protocols
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Networking & High-Speed File Streaming
reqwest = { version = "0.12", features = ["stream"] }
sha2 = "0.10"

# Cryptography & Security
aes-gcm = "0.10"
rand = "0.8"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# BlueZ Bluetooth D-Bus bindings on Linux
# Note: In real build, bluer provides native Linux BlueZ access

[target.'cfg(target_os = "windows")'.dependencies]
# WinRT Bluetooth bindings on Windows
# Note: windows crate provides native WinRT access
