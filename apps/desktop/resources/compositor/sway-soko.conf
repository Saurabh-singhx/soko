# ==============================================================================
# Soko Dynamic Island — Sway / i3 Compositor Window Rules
# Include this file in your ~/.config/sway/config or ~/.config/i3/config:
#   include ~/.config/sway/sway-soko.conf
# ==============================================================================

# Dynamic Island Overlay Window (docked top-center)
for_window [title="Soko Dynamic Island"] {
    floating enable
    sticky enable
    border none
    move position 50ppt 8px
}

for_window [app_id="soko" title="Soko Dynamic Island"] {
    floating enable
    sticky enable
    border none
    move position 50ppt 8px
}

# Settings Hub Window (centered)
for_window [title="Soko Settings & Connection Hub"] {
    floating enable
    move position center
}

for_window [app_id="soko" title="Soko Settings & Connection Hub"] {
    floating enable
    move position center
}
