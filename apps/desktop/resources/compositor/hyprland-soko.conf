# ==============================================================================
# Soko Dynamic Island — Hyprland Compositor Window Rules
# Source this file in your ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/hyprland-soko.conf
# ==============================================================================

# Match Soko Dynamic Island by exact title and window class
windowrulev2 = float, title:^(Soko Dynamic Island)$
windowrulev2 = pin, title:^(Soko Dynamic Island)$
windowrulev2 = noborder, title:^(Soko Dynamic Island)$
windowrulev2 = noshadow, title:^(Soko Dynamic Island)$
windowrulev2 = nodim, title:^(Soko Dynamic Island)$
windowrulev2 = noblur, title:^(Soko Dynamic Island)$
windowrulev2 = noinitialfocus, title:^(Soko Dynamic Island)$

# Keep Dynamic Island pinned horizontally centered at top across all workspaces
windowrulev2 = move 50% 12, title:^(Soko Dynamic Island)$

# Ensure Settings Hub floats centered
windowrulev2 = float, title:^(Soko Settings & Connection Hub)$
windowrulev2 = center, title:^(Soko Settings & Connection Hub)$
