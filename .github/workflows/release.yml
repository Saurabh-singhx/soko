name: Release Multi-Platform Binaries & Auto-Update Feed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version override (e.g. 1.0.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Monotonic Build Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./package.json').version")"
          fi
          # Strip any leading 'v'
          VER="${VER#v}"
          TAG="v${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "=================================================="
          echo " Soko Release Target: ${VER} (${TAG})"
          echo "=================================================="

  build-linux-and-apk:
    name: Build Linux Binaries & Android APKs
    needs: [prepare-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 & Android Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies for Electron Linux & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libasound2-dev python3-pil

      - name: Apply Resolved Build Version
        run: |
          node scripts/update_version.js "${{ needs.prepare-version.outputs.version }}"

      - name: Install Node Dependencies
        run: |
          npm install
          npm --prefix apps/desktop install

      - name: Build Web Frontend
        run: npm run build:desktop

      - name: Package Linux Desktop Targets (.AppImage, .deb, .rpm, .tar.gz)
        run: npm run build:linux

      - name: Build Standalone Android APKs (soko-mobile & lite)
        env:
          SOKO_VERSION: ${{ needs.prepare-version.outputs.version }}
          SOKO_BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash scripts/build_apks.sh

      - name: Upload Linux & Android Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-and-apk-assets
          if-no-files-found: warn
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.tar.gz
            apks/soko-mobile.apk
            apks/soko-mobile-lite.apk
            apks/soko-desktop.apk

  build-windows:
    name: Build Windows Binaries
    needs: [prepare-version]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Resolved Build Version
        run: |
          node scripts/update_version.js "${{ needs.prepare-version.outputs.version }}"

      - name: Install Node Dependencies
        run: |
          npm install
          npm --prefix apps/desktop install

      - name: Build Web Frontend
        run: npm run build:desktop

      - name: Package Windows Desktop Targets (.exe, .zip)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:windows

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip

  build-macos:
    name: Build macOS Binaries
    needs: [prepare-version]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Resolved Build Version
        run: |
          node scripts/update_version.js "${{ needs.prepare-version.outputs.version }}"

      - name: Install Node Dependencies
        run: |
          npm install
          npm --prefix apps/desktop install

      - name: Build Web Frontend
        run: npm run build:desktop

      - name: Package macOS Desktop Targets (.dmg, .zip)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:macos

      - name: Upload macOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            dist-desktop/*.dmg
            dist-desktop/*-mac.zip

  publish-release:
    name: Publish Unified GitHub Release & Update Gist Feed
    needs: [prepare-version, build-linux-and-apk, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Linux & Android Assets
        uses: actions/download-artifact@v4
        with:
          name: linux-and-apk-assets
          path: release-assets
          merge-multiple: true

      - name: Download Windows Assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets
          merge-multiple: true

      - name: Download macOS Assets (Optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-assets
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "=== Collated Multi-Platform Release Binaries ==="
          ls -lh release-assets/

      - name: Publish Unified Multi-Platform GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          name: "Soko ${{ needs.prepare-version.outputs.tag }} Release"
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize Auto-Update Gist Feed (GIST_SECRET)
        env:
          SOKO_VERSION: ${{ needs.prepare-version.outputs.version }}
          SOKO_BUILD_NUMBER: ${{ github.run_number }}
          GIST_SECRET: ${{ secrets.GIST_SECRET || secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID || vars.GIST_ID || '04c5db7f1bed9206d1b858cd44bfb8eb' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/publish_gist_update.js
